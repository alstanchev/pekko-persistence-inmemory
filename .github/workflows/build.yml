name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# cancel superseded runs of the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Scala ${{ matrix.scala }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with crossScalaVersions in project/ProjectSettings.scala
        scala: [ '2.13.18', '3.3.9' ]
        # Pekko 2.x requires Java 17+; test the minimum and the current LTS releases
        java: [ '17', '21', '25' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile and test
        run: sbt -batch ++${{ matrix.scala }} clean test

      - name: Check formatting
        # sbt-scalariform formats sources on compile; a dirty tree means unformatted code was committed.
        # Runs even if tests failed. Note: scalariform cannot parse Scala 3-only syntax (e.g. top-level
        # definitions in src/main/scala-3/.../package.scala) and skips such files with a warning.
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --exit-code; then
            echo "::error::Sources are not formatted. Run 'sbt +Test/compile' locally and commit the result."
            exit 1
          fi

  package:
    name: Package (docs, sources, POM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # builds every artifact that a release publishes, so scaladoc / POM problems
      # show up on the PR instead of at release time
      - name: Package all artifacts
        run: sbt -batch +packageBin +packageSrc +packageDoc +makePom
