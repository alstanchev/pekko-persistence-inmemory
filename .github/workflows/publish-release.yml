name: Build and Publish release
run-name: Publish release ${{ github.event.inputs.release || '' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version only used for run name. Actual release version is taken from version.sbt'
        required: false
        type: string

jobs:
  publish-artifacts:
    runs-on: ubuntu-20.04
    if: github.event.inputs.release && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Import GPG key
        run: |
          echo "${{ secrets.PGP_SECRET }}" | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: sbt

      - name: Build project
        run: ./build.sh

      - name: Publish Signed Artifacts
        run: sbt +publishSigned
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Tag branch
        run: |
          version=$(grep 'version := ' version.sbt | sed -E 's/version := \"(.*)\"/\1/')
          git tag -a "v${{ version }}" -m "Release ${{ version }}"
          git push origin "v${{ version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
