name: Build and Publish release
run-name: Publish release ${{ github.event.inputs.release || '' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version used for the run name only. Actual release version (and tag) is taken from version.sbt'
        required: false
        type: string
      build:
        description: 'Build version'
        required: true
        type: boolean
        default: true
      publish:
        description: 'Publish version'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Tag version'
        required: true
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  publish-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from version.sbt
        run: |
          VERSION=$(sed -nE 's/^version := "(.*)"/\1/p' version.sbt)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from version.sbt"
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::version.sbt contains a SNAPSHOT version ($VERSION). Run the 'Prepare release' workflow first."
            exit 1
          fi
          if [ -n "$RELEASE_INPUT" ] && [ "$RELEASE_INPUT" != "$VERSION" ]; then
            echo "::error::Input release '$RELEASE_INPUT' does not match version.sbt '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION"
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}

      - name: Import GPG key
        if: ${{ github.event.inputs.publish == 'true' }}
        # PGP_SECRET may be either the ASCII-armored private key or its base64 encoding
        run: |
          if printf '%s' "$PGP_SECRET" | base64 --decode 2>/dev/null | grep -q 'BEGIN PGP'; then
            printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
          else
            printf '%s\n' "$PGP_SECRET" | gpg --batch --import
          fi
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          # Pekko 2.x requires Java 17+
          java-version: '17'
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build project
        if: ${{ github.event.inputs.build == 'true' }}
        run: ./build.sh

      - name: Publish Signed Artifacts
        if: ${{ github.event.inputs.publish == 'true' }}
        run: ./sbt-publish.sh
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          # Sonatype Central Portal user token (https://central.sonatype.com/account), not the legacy OSSRH login
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Tag branch
        if: ${{ github.event.inputs.tag == 'true' }}
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
