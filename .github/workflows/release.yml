name: Prepare release
run-name: Prepare release ${{ github.event.inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  
jobs:
  release:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Update version.sbt
        run: |
          echo "version := \"${{ github.event.inputs.release }}\"" > version.sbt
          echo "cat version.sbt"
          cat version.sbt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update version to ${{ github.event.inputs.release }}"
          branch: "release-${{ github.event.inputs.release }}"
          base: master
          title: "Release ${{ github.event.inputs.release }}"
          body: "This PR updates the version to ${{ github.event.inputs.release }}."
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
