name: Prepare release
run-name: Prepare release ${{ github.event.inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event.inputs.release }}
    steps:
      - name: Validate release version
        run: |
          if ! [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version '$RELEASE' is not of the form X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Update version.sbt
        run: |
          echo "version := \"$RELEASE\"" > version.sbt
          echo "cat version.sbt"
          cat version.sbt

      - name: Create release branch and commit changes
        run: |
          git checkout -b "release/$RELEASE"
          git add version.sbt
          git commit -m "Update version to $RELEASE"
          git push origin "release/$RELEASE"
